# Temporary harness: runs only the Rust build and test shards, so the shard
# layout, disk usage, and fixture generation measurements skip the full
# pre-merge regression that .github changes trigger. Delete before the PR.

name: Rust test shards trial
on:
  push:
    branches: [ci/rust-test-shards]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reads the warm rust-cache that fork master already holds, like a PR does.
jobs:
  runtime:
    name: Runtime binaries
    uses: ./.github/workflows/_build_ci_artifacts.yml
    with:
      task: runtime
      timeout-minutes: 60

  rust-test-build:
    name: Rust test artifacts
    uses: ./.github/workflows/_build_ci_artifacts.yml
    with:
      task: test-build
      test-scope: workspace
      timeout-minutes: 60

  rust-tests:
    name: Rust tests
    needs: [runtime, rust-test-build]
    uses: ./.github/workflows/_rust_tests.yml

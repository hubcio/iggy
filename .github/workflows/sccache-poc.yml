# Temporary harness: runs only the Rust build and test shards, so each sccache
# stash and shard-layout measurement skips the full pre-merge regression that
# .github changes trigger. Delete before opening the PR.

name: sccache PoC
on:
  push:
    branches: [ci/sccache-stash-poc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A fork has no rust-cache yet; save-cache seeds it on the first run so later
# runs start from warm dependencies like apache/iggy CI does.
jobs:
  runtime:
    name: Runtime binaries
    uses: ./.github/workflows/_build_ci_artifacts.yml
    with:
      task: runtime
      save-cache: true
      timeout-minutes: 60
    permissions:
      contents: read
      actions: read

  rust-test-build:
    name: Rust test artifacts
    uses: ./.github/workflows/_build_ci_artifacts.yml
    with:
      task: test-build
      test-scope: workspace
      save-cache: true
      timeout-minutes: 60
    permissions:
      contents: read
      actions: read

  rust-tests:
    name: Rust tests
    needs: [runtime, rust-test-build]
    uses: ./.github/workflows/_rust_tests.yml
